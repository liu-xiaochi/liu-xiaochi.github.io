<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同位素瑞利分馏模拟器 · Rayleigh Isotope</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e3e8f0;
    --accent:#7c3aed; --accent-soft:#f5f0ff; --danger:#dc2626; --warn:#b45309; --ok:#15803d;
    --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --logo-a:#7c3aed; --logo-b:#2563eb;
  }
  body[data-view="mineral"]{ --accent:#0891b2; --accent-soft:#ecfeff; --logo-a:#0891b2; --logo-b:#0ea5e9; }
  body[data-view="afc"]{ --accent:#0d9488; --accent-soft:#effcf9; --logo-a:#0d9488; --logo-b:#14b8a6; }
  body[data-view="docs"]{ --accent:#475569; --accent-soft:#f1f5f9; --logo-a:#475569; --logo-b:#64748b; }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:.2px}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none !important}

  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px;margin-right:4px}
  .logo{
    width:36px;height:36px;border-radius:10px;flex:none;
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;letter-spacing:.3px;
    background:linear-gradient(135deg,var(--logo-a),var(--logo-b));
    box-shadow:0 6px 16px rgba(124,58,237,.22);transition:.2s;
  }
  .brand h1{font-size:15px}
  .sub{margin:0;color:var(--muted);font-size:11.5px}

  .modules{display:flex;gap:3px;background:#eef2f7;padding:3px;border-radius:11px;flex-wrap:wrap}
  .mod-btn{
    border:0;background:transparent;padding:6px 12px;border-radius:9px;
    font-size:12.5px;color:#475569;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .mod-btn:hover{color:#0f172a}
  .mod-btn.active{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.1)}

  .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
  .preset{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .preset select{
    max-width:270px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:12.5px;color:var(--ink);
  }
  .btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;
    cursor:pointer;font-size:12.5px;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#c9d4e5;background:#f8fafc}
  .btn.ghost{color:#334155}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .layout{
    display:grid;grid-template-columns:minmax(400px,480px) minmax(0,1fr);
    gap:18px;padding:18px 22px 34px;max-width:1640px;margin:0 auto;align-items:start;
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .left{padding:16px 16px 18px;position:sticky;top:72px;max-height:calc(100vh - 92px);overflow:auto}
  .right{padding:16px 18px 20px;min-width:0}

  .block{padding:12px 0;border-bottom:1px dashed var(--line)}
  .block:last-child{border-bottom:0;padding-bottom:0}
  .block:first-child{padding-top:0}
  .block h2{font-size:13px;color:#334155;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .block h2 .tag{font-size:11px;font-weight:500;color:var(--muted);background:#f1f5f9;border-radius:6px;padding:2px 6px;margin-left:auto}

  .wide-select{
    width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;
    font-size:12.8px;color:var(--ink);
  }
  .wide-select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  .params{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
  .params.three{grid-template-columns:1fr 1fr 1fr}
  .field{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
  .field input,.field select{
    width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-family:var(--mono);font-size:12.5px;color:var(--ink);
  }
  .field select{font-family:inherit;font-size:12.5px}
  .field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .inline-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#334155;margin-top:8px}
  .inline-toggle input{accent-color:var(--accent)}

  .tbl-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:310px}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  th,td{padding:0;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}
  thead th{
    position:sticky;top:0;z-index:1;background:#f8fafc;color:#475569;font-weight:600;font-size:11px;
    padding:7px 5px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:3px 3px}
  tbody tr:last-child td{border-bottom:0}
  td input[type=text],td input[type=number]{
    width:100%;min-width:46px;border:1px solid transparent;border-radius:6px;background:transparent;
    padding:5px 4px;font-size:12px;
  }
  td input[type=text]:hover,td input[type=number]:hover{background:#f8fafc;border-color:#eef2f7}
  td input[type=text]:focus,td input[type=number]:focus{background:#fff;border-color:var(--accent);outline:2px solid var(--accent-soft)}
  td input.num{font-family:var(--mono);text-align:right;min-width:60px;padding:5px 3px}
  td.name input{min-width:76px;font-weight:500}
  td.iso input{min-width:64px;text-align:right;font-family:var(--mono);font-size:11.5px}
  td.narrow input{min-width:38px}
  th.numcol{text-align:right}
  .del{
    border:0;background:transparent;color:#94a3b8;cursor:pointer;font-size:15px;line-height:1;
    padding:2px 5px;border-radius:6px;
  }
  .del:hover{color:var(--danger);background:#fef2f2}
  .row-add{
    margin-top:8px;border:1px dashed #cbd5e1;background:#fbfdff;color:#475569;border-radius:9px;
    padding:6px 10px;width:100%;cursor:pointer;font-size:12.5px;
  }
  .row-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.55}
  .note b{color:#334155;font-weight:600}
  .warnline{font-size:11.5px;margin:8px 0 0;line-height:1.55}
  .warnline.bad{color:var(--warn)}
  .warnline.ok{color:var(--ok)}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .stat b{display:block;font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .chart-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .chart-head h2{font-size:14px;margin-right:auto}
  .chart-head .tag{font-size:11px;color:var(--muted);background:#f1f5f9;border-radius:6px;padding:2px 7px}
  .chart-wrap{position:relative;width:100%;height:390px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .chart-wrap canvas{display:block;width:100%;height:100%}
  .chart-wrap.small{height:300px}
  .tooltip{
    position:absolute;pointer-events:none;z-index:5;background:rgba(15,23,42,.92);color:#fff;
    border-radius:9px;padding:8px 10px;font-size:11.5px;line-height:1.5;max-width:270px;
    box-shadow:0 6px 20px rgba(15,23,42,.25);transform:translate(10px,-50%);
  }
  .tooltip b{font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:#334155}
  .legend .item{display:flex;align-items:center;gap:6px}
  .legend svg{overflow:visible}

  .tbl-out{margin-top:14px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .tbl-out table{font-size:12px}
  .tbl-out th,.tbl-out td{padding:6px 9px;text-align:right}
  .tbl-out th:first-child,.tbl-out td:first-child{text-align:left}
  .tbl-out thead th{background:#f8fafc;border-bottom:1px solid var(--line)}
  .tbl-out td{font-family:var(--mono);font-size:11.5px}
  .tbl-out td small{display:block;color:var(--muted);font-family:system-ui,sans-serif;font-size:10px}
  .empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:12.5px}

  .formula{
    font-family:var(--mono);font-size:11.8px;line-height:1.75;color:#334155;
    background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;white-space:pre-wrap;
  }
  .formula b{color:var(--accent);font-weight:600}

  details.help{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#fbfdff}
  details.help summary{cursor:pointer;padding:9px 12px;font-size:12.5px;color:#334155;font-weight:600}
  details.help .body{padding:2px 14px 14px;font-size:12px;color:#475569;line-height:1.65}
  details.help code{font-family:var(--mono);background:#eef2f7;border-radius:4px;padding:1px 5px;font-size:11.5px}
  details.help ul{margin:6px 0 0;padding-left:18px}
  details.help li{margin:4px 0}

  dialog{
    border:1px solid var(--line);border-radius:16px;padding:0;max-width:720px;width:calc(100% - 40px);
    box-shadow:0 24px 70px rgba(15,23,42,.3);
  }
  dialog::backdrop{background:rgba(15,23,42,.35);backdrop-filter:blur(2px)}
  .dlg-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dlg-head h3{font-size:14px;margin-right:auto}
  .dlg-body{padding:14px 18px 18px;font-size:13px;color:#334155;max-height:70vh;overflow:auto}
  .dlg-body table{width:100%;font-size:12px;margin-top:8px;table-layout:fixed}
  .dlg-body th,.dlg-body td{padding:6px 6px;border-bottom:1px solid #eef2f7;text-align:right;white-space:normal;vertical-align:top}
  .dlg-body th:first-child,.dlg-body td:first-child{text-align:left;width:40%}
  .dlg-body th:last-child,.dlg-body td:last-child{width:7%}
  .doc table th,.doc table td{white-space:normal}
  .ok{color:var(--ok);font-weight:600}
  .bad{color:var(--danger);font-weight:600}

  .docwrap{max-width:1080px;margin:0 auto;padding:18px 22px 40px}
  .doc{padding:24px 30px 34px;line-height:1.75;color:#1e293b}
  .doc h1{font-size:20px;margin:0 0 6px}
  .doc h2{font-size:15px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .doc h3{font-size:13px;margin:16px 0 5px}
  .doc p{margin:7px 0}
  .doc ul,.doc ol{margin:6px 0;padding-left:22px}
  .doc li{margin:4px 0}
  .doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
  .doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .doc th{background:#f8fafc;font-weight:600;color:#334155}
  .doc code{font-family:var(--mono);background:#eef2f7;border-radius:4px;padding:1px 5px;font-size:11.5px}
  .doc .eq{font-family:var(--mono);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:8px 0;font-size:12px;white-space:pre-wrap}
  .doc .kv{color:var(--muted);font-size:11.5px}
  .doc .callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:12.5px}

  @media (max-width:1080px){
    .layout{grid-template-columns:1fr}
    .left{position:static;max-height:none}
  }
  @media (max-width:640px){
    .topbar{padding:10px 12px}
    .layout{padding:12px}
    .params,.params.three{grid-template-columns:1fr}
    .summary{grid-template-columns:1fr 1fr}
    .chart-wrap{height:320px}
    .doc{padding:18px 16px 24px}
  }
</style>
</head>
<body data-view="main">

<header class="topbar">
  <div class="brand">
    <div class="logo">δ</div>
    <div>
      <h1>同位素瑞利分馏模拟器</h1>
      <p class="sub" id="subtitle">Rayleigh 蒸馏 · 结晶 / 去气 / 熔融 / AFC</p>
    </div>
  </div>
  <nav class="modules" id="viewNav">
    <button class="mod-btn active" data-view="main">瑞利分馏</button>
    <button class="mod-btn" data-view="mineral">多矿物 / Δ(T) / 变 α</button>
    <button class="mod-btn" data-view="afc">AFC 同位素</button>
    <button class="mod-btn" data-view="docs">说明与校验</button>
  </nav>
  <div class="top-actions">
    <label class="preset">预设
      <select id="preset"></select>
    </label>
    <button class="btn ghost" id="btnTest">方程校验</button>
    <button class="btn ghost" id="btnCSV">导出 CSV</button>
  </div>
</header>

<section class="view" id="view-main">
  <main class="layout">
    <aside class="panel left" id="left-main"></aside>
    <section class="panel right" id="right-main"></section>
  </main>
</section>

<section class="view hidden" id="view-mineral">
  <main class="layout">
    <aside class="panel left" id="left-mineral"></aside>
    <section class="panel right" id="right-mineral"></section>
  </main>
</section>

<section class="view hidden" id="view-afc">
  <main class="layout">
    <aside class="panel left" id="left-afc"></aside>
    <section class="panel right" id="right-afc"></section>
  </main>
</section>

<section class="view hidden" id="view-docs">
  <div class="docwrap">
    <article class="panel doc" id="docBody"></article>
  </div>
</section>

<dialog id="testDialog">
  <div class="dlg-head"><h3>方程校验</h3><button class="btn ghost" id="dlgClose">关闭</button></div>
  <div class="dlg-body" id="testBody"></div>
</dialog>

<script>
'use strict';

/* ================= common ================= */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 3) => {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  if (!isFinite(v)) return '∞';
  const a = Math.abs(v);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(2);
  return v.toFixed(d).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '') || '0';
};
const deepClone = o => JSON.parse(JSON.stringify(o));
const num = (v, d = 0) => { const x = +v; return Number.isFinite(x) ? x : d; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function niceTicks(min, max, count){
  const span = max - min;
  if (span <= 0) return [min];
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step;
  if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 5) step = 5; else step = 10;
  step *= mag;
  const start = Math.ceil(min / step - 1e-9) * step;
  const out = [];
  for (let v = start; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function logTicks(min, max){
  const out = [];
  const a = Math.ceil(Math.log10(min) - 1e-9);
  const b = Math.floor(Math.log10(max) + 1e-9);
  for (let e = a; e <= b; e++){
    const v = Math.pow(10, e);
    out.push(v);
    if (b - a <= 2) for (let k = 2; k <= 9; k++){
      const vv = k * v;
      if (vv <= max) out.push(vv);
    }
  }
  return out.sort((x, y) => x - y);
}

function tickText(v, span){
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e5 || (a > 0 && a < 1e-4)) return v.toExponential(1);
  const d = Math.max(0, Math.min(6, Math.ceil(-Math.log10(Math.max(span, 1e-12))) + 1));
  return v.toFixed(d);
}

function xTickText(v, xMax){
  if (Math.abs(v) >= 1000 || (Math.abs(v) > 0 && Math.abs(v) < 0.001)) return v.toExponential(1);
  if (Math.abs(xMax) > 2) return String(Math.round(v * 1000) / 1000);
  return v.toFixed(3).replace(/\.?0+$/, '') || '0';
}

function valueAt(points, x){
  if (!points || !points.length) return null;
  let lo = 0, hi = points.length - 1;
  if (x <= points[0].x) return points[0].y;
  if (x >= points[hi].x) return points[hi].y;
  while (hi - lo > 1){
    const mid = (lo + hi) >> 1;
    if (points[mid].x <= x) lo = mid; else hi = mid;
  }
  const a = points[lo], b = points[hi];
  const t = (x - a.x) / ((b.x - a.x) || 1);
  return a.y + (b.y - a.y) * t;
}

function makeChart(canvasSel, wrapSel, tipSel){
  const ch = { canvas: $(canvasSel), wrap: $(wrapSel), tip: $(tipSel), cache: null, hover: null };
  if (!ch.canvas || !ch.wrap) return null;
  ch.wrap.addEventListener('mousemove', e => {
    if (!ch.cache) return;
    const r = ch.wrap.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const c = ch.cache;
    if (mx < c.x0 || mx > c.x1){ ch.tip.hidden = true; return; }
    const x = c.xMin + (mx - c.x0) / (c.x1 - c.x0) * (c.xMax - c.xMin);
    ch.hover = x;
    drawChart(ch, c.series, c.opt);
    showTip(ch, e.clientX - r.left, e.clientY - r.top, x);
  });
  ch.wrap.addEventListener('mouseleave', () => {
    ch.hover = null; ch.tip.hidden = true;
    if (ch.cache) drawChart(ch, ch.cache.series, ch.cache.opt);
  });
  return ch;
}

function drawChart(ch, series, opt){
  const canvas = ch.canvas, wrap = ch.wrap;
  const W = Math.max(320, wrap.clientWidth);
  const H = Math.max(200, wrap.clientHeight);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const pad = { l: 68, r: 18, t: 16, b: 46 };
  const x0 = pad.l, x1 = W - pad.r, y0 = pad.t, y1 = H - pad.b;
  const plotW = x1 - x0, plotH = y1 - y0;
  const xMin = opt.xMin, xMax = opt.xMax;

  const ys = [];
  for (const s of series) for (const p of s.points){
    if (isFinite(p.y) && (!opt.logY || p.y > 0)) ys.push(p.y);
  }
  if (!ys.length){
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('没有可绘制的数据', W / 2, H / 2);
    ch.cache = null;
    return;
  }

  let vMin = Math.min(...ys), vMax = Math.max(...ys);
  if (opt.logY){
    const lo = Math.pow(10, Math.floor(Math.log10(Math.max(vMin, 1e-12))));
    const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(vMax, lo * 10))));
    vMin = lo; vMax = hi;
  } else {
    const padY = (vMax - vMin) * 0.07 || Math.abs(vMax) * 0.07 || 1;
    if (opt.zeroLine){
      vMin = Math.min(vMin, 0); vMax = Math.max(vMax, 0);
    }
    vMin = vMin - padY * 0.25;
    vMax = vMax + padY;
  }

  const yv = v => {
    if (opt.logY){
      const t = (Math.log10(Math.max(v, 1e-12)) - Math.log10(vMin)) / (Math.log10(vMax) - Math.log10(vMin));
      return y1 - t * plotH;
    }
    return y1 - ((v - vMin) / (vMax - vMin || 1)) * plotH;
  };
  const xv = x => x0 + ((x - xMin) / (xMax - xMin || 1)) * plotW;

  ctx.lineWidth = 1;
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#64748b';

  const xTicks = niceTicks(xMin, xMax, 6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const t of xTicks){
    if (t < xMin - 1e-9 || t > xMax + 1e-9) continue;
    const x = xv(t);
    ctx.strokeStyle = '#eef2f7';
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    ctx.fillText(xTickText(t, xMax), x, y1 + 8);
  }

  const yTicks = opt.logY ? logTicks(vMin, vMax) : niceTicks(vMin, vMax, 6);
  const ySpan = vMax - vMin;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const t of yTicks){
    if (t < vMin - 1e-12 || t > vMax + 1e-12) continue;
    const y = yv(t);
    if (y < y0 - 1 || y > y1 + 1) continue;
    ctx.strokeStyle = '#eef2f7';
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.fillStyle = '#64748b';
    ctx.fillText(opt.logY ? (t >= 1 ? String(Math.round(t)) : t.toExponential(0)) : tickText(t, ySpan), x0 - 8, y);
  }

  if (vMin <= 0 && vMax >= 0){
    ctx.strokeStyle = '#cbd5e1'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x0, yv(0)); ctx.lineTo(x1, yv(0)); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = '#cbd5e1';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();

  for (const s of series){
    if (!s.points.length) continue;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width || 2;
    ctx.setLineDash(s.dash || []);
    ctx.beginPath();
    let started = false;
    for (const p of s.points){
      if (!isFinite(p.y) || (opt.logY && p.y <= 0)){ started = false; continue; }
      const X = xv(p.x), Y = yv(p.y);
      if (!started){ ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  if (ch.hover !== null && ch.hover >= xMin && ch.hover <= xMax){
    const hx = xv(ch.hover);
    ctx.strokeStyle = '#94a3b8'; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(hx, y0); ctx.lineTo(hx, y1); ctx.stroke();
    ctx.setLineDash([]);
    for (const s of series){
      const y = valueAt(s.points, ch.hover);
      if (!isFinite(y) || (opt.logY && y <= 0)) continue;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx, yv(y), 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  ctx.fillStyle = '#475569';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(opt.xLabel, (x0 + x1) / 2, H - 20);
  ctx.save();
  ctx.translate(16, (y0 + y1) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle';
  ctx.fillText(opt.yLabel, 0, 0);
  ctx.restore();

  ch.cache = { series, opt, x0, x1, y0, y1, xMin, xMax, vMin, vMax, yv, xv, W, H };
}

function showTip(ch, xPix, yPix, x){
  const c = ch.cache;
  const rows = c.series
    .map(s => ({ s, y: valueAt(s.points, x) }))
    .filter(o => isFinite(o.y))
    .sort((a, b) => b.y - a.y);
  if (!rows.length){ ch.tip.hidden = true; return; }
  ch.tip.hidden = false;
  ch.tip.style.left = Math.max(4, Math.min(xPix, c.W - 290)) + 'px';
  ch.tip.style.top = Math.max(40, Math.min(yPix, c.H - 30)) + 'px';
  const xTag = c.opt.xTag || 'x';
  const dig = c.opt.yDigits || 3;
  ch.tip.innerHTML = `<div style="color:#cbd5e1;margin-bottom:4px">${esc(xTag)} = <b style="color:#fff">${fmt(x, 4)}</b></div>` +
    rows.map(o => `<div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${o.s.color};margin-right:6px"></span>${esc(o.s.label)} <b>${fmt(o.y, dig)}</b></div>`).join('');
}

/* ================= isotope math ================= */
const PALETTE = ['#7c3aed', '#dc2626', '#0891b2', '#ea580c', '#16a34a', '#db2777', '#2563eb', '#65a30d', '#475569', '#b45309'];

function d2R(d){ return 1 + (+d || 0) / 1000; }
function R2d(r){ return (r - 1) * 1000; }
function alphaOf(delta, mode){ return mode === 'exp' ? Math.exp((+delta || 0) / 1000) : 1 + (+delta || 0) / 1000; }

/* Unified point for one process at one F (melt/vapor fraction). */
function computePoint(proc, sys, F, mode){
  const a = alphaOf(sys.delta, mode);
  const R0 = d2R(sys.d0);
  const D = Math.max(0, num(sys.D, 1));

  if (proc === 'fc'){
    if (!(F > 0)) return null;
    const f = Math.pow(F, D);
    const RL = R0 * Math.pow(f, a - 1);
    const C = Math.pow(F, D - 1);
    let dacc = null;
    const cm = 1 - F * C;                    // crystal-borne element mass (C0 = 1)
    if (cm > 1e-9) dacc = R2d((R0 - F * C * RL) / cm);
    return { F, f, dm: R2d(RL), di: R2d(a * RL), dacc, C };
  }

  if (proc === 'degas'){
    const Fv = clamp(F, 0, 1 - 1e-9);
    const f = Math.pow(1 - Fv, D);
    const RL = R0 * Math.pow(f, a - 1);
    const C = Math.pow(1 - Fv, D - 1);
    let dacc = null;
    if (1 - f > 1e-12) dacc = R2d((R0 - f * RL) / (1 - f));
    return { F: Fv, f, dm: R2d(RL), di: R2d(a * RL), dacc, C };
  }

  if (proc === 'eqcryst'){
    if (!(F > 0)) return null;
    const C = 1 / (D + F * (1 - D));
    const RL = R0 * (F + (1 - F) * D) / (F + (1 - F) * D * a);
    return { F, f: F * C, dm: R2d(RL), di: R2d(a * RL), dacc: null, C };
  }

  if (proc === 'batchmelt'){
    if (!(F > 0)) return null;
    const C = 1 / (D + F * (1 - D));
    const RL = R0 * (F + (1 - F) * D) / (F + (1 - F) * D / a);
    return { F, f: F * C, dm: R2d(RL), di: R2d(RL / a), dacc: null, C };
  }

  if (proc === 'fracmelt'){
    if (F >= 1 || !(D > 0)) return null;
    const Cres = Math.pow(1 - F, 1 / D - 1);
    const C = Cres / D;
    const fres = Math.pow(1 - F, 1 / D);
    const Rres = R0 * Math.pow(fres, a - 1);
    const RL = a * Rres;
    const elemMelt = 1 - (1 - F) * Cres;
    let dacc = null;
    if (elemMelt > 1e-9) dacc = R2d((R0 - (1 - F) * Cres * Rres) / elemMelt);
    return { F, f: fres, dm: R2d(RL), di: R2d(Rres), dacc, C };
  }
  return null;
}

function bindMain(){
  const s = state.main;
  const left = $('#left-main');
  const right = $('#right-main');

  left.oninput = mainEdit;
  left.onchange = mainEdit;
  right.oninput = e => {
    if (e.target.id === 'mainSysSel'){ s.tableSys = +e.target.value; updateMain(); }
  };
  right.onchange = right.oninput;

  left.onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del){
      const i = +del.dataset.del;
      s.systems.splice(i, 1);
      if (s.tableSys >= s.systems.length) s.tableSys = Math.max(0, s.systems.length - 1);
      renderMain();
      return;
    }
    if (e.target.closest('#addSys')){
      s.systems.push({ name: '新体系', iso: 'δ', d0: 0, delta: 0, D: 1, on: true });
      renderMain();
    }
  };
}

function mainEdit(e){
  const t = e.target;
  const s = state.main;
  if (t.id === 'proc'){ s.proc = t.value; renderMain(); return; }
  if (t.id === 'alphaMode'){ s.alphaMode = t.value; updateMain(); return; }
  if (t.id === 'xAxis'){ s.xAxis = t.value; updateMain(); return; }
  if (t.id === 'Fmin' || t.id === 'Fmax' || t.id === 'N'){ s[t.id] = num(t.value, s[t.id]); updateMain(); return; }
  if (t.id === 'showInst' || t.id === 'showAcc'){ s[t.id] = t.checked; updateMain(); return; }
  if (t.dataset && t.dataset.i !== undefined){
    const i = +t.dataset.i;
    if (!s.systems[i]) return;
    const k = t.dataset.k;
    if (k === 'on') s.systems[i].on = t.checked;
    else if (k === 'name' || k === 'iso') s.systems[i][k] = t.value;
    else s.systems[i][k] = num(t.value, 0);
    updateMain();
  }
}

function mainGrid(s){
  const N = clamp(Math.round(s.N), 4, 400);
  let Fmin = clamp(s.Fmin, 0, 0.9999);
  let Fmax = clamp(s.Fmax, 0.0001, 1);
  if (Fmax <= Fmin) Fmax = Math.min(1, Fmin + 0.01);
  if (s.proc === 'fc' || s.proc === 'eqcryst') Fmin = Math.max(Fmin, 1e-4);
  if (s.proc === 'degas') Fmax = Math.min(Fmax, 1 - 1e-9);
  if (s.proc === 'fracmelt') Fmax = Math.min(Fmax, 0.999);
  const arr = [];
  for (let i = 0; i <= N; i++) arr.push(Fmin + (Fmax - Fmin) * i / N);
  return arr;
}

function updateMain(){
  const s = state.main;
  const P = PROCESS[s.proc];
  const tag = $('#mainTag');
  const msg = $('#mainMsg');
  if (!tag || !msg) return;

  const vis = s.systems.filter(x => x.on);
  if (!vis.length){
    if (charts.main) drawChart(charts.main, [], { xMin: 0, xMax: 1, xLabel: 'F', yLabel: 'δ (‰)' });
    $('#mainLegend').innerHTML = '';
    $('#mainSummary').innerHTML = '';
    $('#mainTable').innerHTML = '';
    msg.className = 'note';
    msg.textContent = '请在左侧勾选至少一个体系。';
    return;
  }

  const Fs = mainGrid(s);
  const bySys = [];
  for (const sys of vis){
    const pts = [];
    for (const F of Fs){
      const p = computePoint(s.proc, sys, F, s.alphaMode);
      if (!p) continue;
      p.ax = s.xAxis === 'f' ? p.f : p.F;
      pts.push(p);
    }
    pts.sort((a, b) => a.ax - b.ax);
    bySys.push({ sys, pts });
  }

  const defs = SERIES_DEFS[s.proc];
  const series = [];
  bySys.forEach(({ sys, pts }, si) => {
    const color = PALETTE[si % PALETTE.length];
    for (const def of defs){
      if (def.key === 'di' && (!P.hasInst || !s.showInst)) continue;
      if (def.key === 'dacc' && (!P.hasAcc || !s.showAcc)) continue;
      const points = pts.map(p => ({ x: p.ax, y: p[def.key] })).filter(o => Number.isFinite(o.y));
      if (!points.length) continue;
      series.push({ points, color, dash: def.dash, label: `${sys.name} ${def.label}` });
    }
  });

  const xs = series.flatMap(x => x.points.map(p => p.x));
  let xMin = xs.length ? Math.min(...xs) : 0;
  let xMax = xs.length ? Math.max(...xs) : 1;
  if (!(xMax > xMin)){ xMin -= 0.01; xMax += 0.01; }

  const fIsResidue = s.proc === 'fracmelt';
  const xLabel = s.xAxis === 'f'
    ? (fIsResidue ? 'f（残余相元素分数）' : 'f（熔体元素分数）')
    : (s.proc === 'degas' ? 'F_v（蒸气分数）' : 'F（熔体分数）');

  const opt = { xMin, xMax, xLabel, yLabel: 'δ (‰)', xTag: s.xAxis === 'f' ? 'f' : 'F', yDigits: 3 };
  if (charts.main) drawChart(charts.main, series, opt);
  renderLegend($('#mainLegend'), series);

  const first = bySys[0];
  const best = first.pts.reduce((a, b) => Math.abs(b.dm - first.sys.d0) > Math.abs(a.dm - first.sys.d0) ? b : a, first.pts[0]);
  $('#mainSummary').innerHTML = `
    <div class="stat"><b>${fmt(best.dm, 3)}</b><span>${esc(first.sys.iso)} 熔体（${s.xAxis === 'f' ? 'f' : 'F'}=${fmt(best.ax, 3)}）</span></div>
    <div class="stat"><b>${fmt(best.dm - first.sys.d0, 3)}</b><span>相对 δ₀ 的变化 (‰)</span></div>
    <div class="stat"><b>${fmt(best.f, 4)}</b><span>${fIsResidue ? 'f 残余相元素分数' : 'f 熔体元素分数'}</span></div>
    <div class="stat"><b>${fmt(best.C, 3)}</b><span>C/C₀</span></div>`;

  tag.textContent = `${P.label} · ${vis.length} 个体系`;

  // table for one system
  const idx = clamp(Math.round(s.tableSys), 0, s.systems.length - 1);
  s.tableSys = idx;
  const tSys = s.systems[idx];
  const tBy = bySys.find(b => b.sys === tSys) || first;
  const diLabel = (defs.find(d => d.key === 'di') || {}).label || '瞬时相';
  const daccLabel = (defs.find(d => d.key === 'dacc') || {}).label || '累积相';
  const tPts = [...tBy.pts].sort((a, b) => a.F - b.F);
  const rows = [];
  const n = tPts.length;
  const sample = [];
  for (let k = 0; k < 9; k++) sample.push(Math.round(k * (n - 1) / 8));
  for (const i of sample){
    const p = tPts[i];
    if (!p) continue;
    rows.push(`<tr>
      <td>${fmt(p.F, 4)}</td>
      <td>${fmt(p.f, 4)}</td>
      <td>${fmt(p.dm, 3)}</td>
      <td>${fmt(p.di, 3)}</td>
      ${P.hasAcc ? `<td>${fmt(p.dacc, 3)}</td>` : ''}
      <td>${fmt(p.C, 3)}</td>
    </tr>`);
  }
  $('#mainTable').innerHTML = `
    <div style="padding:10px 10px 0"><label class="field" style="max-width:260px">数值表体系
      <select id="mainSysSel">${s.systems.map((x, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    </label></div>
    <table>
      <thead><tr><th>F</th><th>f</th><th>δ 熔体</th><th>δ ${esc(diLabel)}</th>${P.hasAcc ? `<th>δ ${esc(daccLabel)}</th>` : ''}<th>C/C₀</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;

  const warns = [];
  if (s.proc === 'fracmelt' && vis.some(x => num(x.D, 1) <= 0)) warns.push('分离熔融需要 D > 0。');
  if (s.proc === 'fc' && vis.some(x => num(x.D, 1) === 0)) warns.push('D = 0 时元素不进入晶体，熔体成分不变。');
  const styleNote = defs.map(d => `${d.dash.length ? (d.dash[0] === 2 ? '点线' : '虚线') : '实线'} = ${d.label}`).join('；');
  msg.className = warns.length ? 'warnline bad' : 'note';
  msg.textContent = warns.length ? warns.join(' ') : `${styleNote}。悬停查看同一 ${s.xAxis === 'f' ? 'f' : 'F'} 下各曲线数值。`;
}

  if (t.id === 'mformula'){ m.formula = t.value; renderMineral(); return; }
  const map = { mname: 'name', miso: 'iso', md0: 'd0', mFmin: 'Fmin', mFmax: 'Fmax', mN: 'N',
    mTstart: 'Tstart', mTend: 'Tend', mSiO2: 'SiO2', mA: 'A', mB: 'B', mC: 'C',
    ma: 'a', mb: 'b', mfmin: 'fmin', mfmax: 'fmax', mD: 'D' };
  if (map[t.id]){
    const k = map[t.id];
    if (k === 'name' || k === 'iso') m[k] = t.value;
    else m[k] = num(t.value, m[k]);
    updateMineral();
    return;
  }
  if (t.dataset && t.dataset.mi !== undefined){
    const i = +t.dataset.mi;
    if (!m.minerals[i]) return;
    const k = t.dataset.mk;
    if (k === 'name') m.minerals[i].name = t.value;
    else m.minerals[i][k] = num(t.value, 0);
    updateMineral();
  }
}

function dTAt(formula, T, m){
  const K = T + 273.15;
  const K2 = K * K;
  if (formula === 'zr') return -7.87e4 / K2 + 1.94e9 / (K2 * K2) - 5.85e13 / (K2 * K2 * K2);
  if (formula === 'ti') return (-0.5 + 0.017 * num(m.SiO2, 70)) * 1e6 / K2;
  if (formula === 'fe') return -0.15e6 / K2;
  if (formula === 'v') return -0.85e6 / K2;
  return num(m.A, 0) / K2 + num(m.B, 0) / (K2 * K2) + num(m.C, 0) / (K2 * K2 * K2);
}

function solveDT(m){
  const Fmin = clamp(m.Fmin, 1e-3, 0.999);
  const N = clamp(Math.round(num(m.N, 60)), 40, 1000);
  const R0 = d2R(m.d0);
  const D = Math.max(0, num(m.D, 1));
  const Tof = F => m.Tend + (m.Tstart - m.Tend) * (F - Fmin) / (1 - Fmin);
  const dOf = F => dTAt(m.formula, Tof(F), m);

  let prevF = 1, prevA = alphaOf(dOf(1), 'lin'), lnR = 0;
  const pts = [{ F: 1, T: Tof(1), dT: dOf(1), melt: m.d0, inst: R2d(prevA * R0), C: 1 }];
  for (let i = 1; i <= N; i++){
    const t = i / N;
    const F = Math.pow(Fmin, t);
    const T = Tof(F);
    const dTv = dTAt(m.formula, T, m);
    const a = alphaOf(dTv, 'lin');
    lnR += D * ((prevA + a) / 2 - 1) * (Math.log(F) - Math.log(prevF));
    const R = R0 * Math.exp(lnR);
    pts.push({ F, T, dT: dTv, melt: R2d(R), inst: R2d(a * R), C: Math.pow(F, D - 1) });
    prevF = F; prevA = a;
  }
  return pts.reverse();
}

function updateMineral(){
  const m = state.mineral;
  const msg = $('#mineralMsg');
  const tag = $('#mineralTag');
  if (!msg || !tag) return;

  let series = [], opt = null, stats = [], tableHTML = '';

  if (m.mode === 'multi'){
    const minerals = m.minerals.map(x => ({ name: x.name, X: Math.max(0, num(x.X, 0)), delta: num(x.delta, 0), D: Math.max(0, num(x.D, 0)) }));
    let sx = 0, sxd = 0, sxdD = 0;
    for (const mi of minerals){ sx += mi.X; sxd += mi.X * mi.D; sxdD += mi.X * mi.D * mi.delta; }
    if (!(sx > 0)){
      msg.className = 'warnline bad';
      msg.textContent = '请至少给一个矿物非零的 X。';
      if (charts.mineral) drawChart(charts.mineral, [], { xMin: 0, xMax: 1, xLabel: 'F', yLabel: 'δ (‰)' });
      return;
    }
    const Db = sxd / sx;
    const dbulk = sxd > 1e-12 ? sxdD / sxd : minerals.reduce((s, mi) => s + mi.X / sx * mi.delta, 0);
    const sys = { name: m.name, iso: m.iso, d0: m.d0, delta: dbulk, D: Db };

    const N = clamp(Math.round(m.N), 4, 400);
    const Fmin = Math.max(1e-4, Math.min(m.Fmin, 0.999));
    const Fmax = clamp(m.Fmax, Fmin + 1e-4, 1);
    const pts = [];
    for (let i = 0; i <= N; i++){
      const F = Fmin + (Fmax - Fmin) * i / N;
      const p = computePoint('fc', sys, F, 'lin');
      if (p) pts.push(p);
    }

    const defs = SERIES_DEFS.fc;
    series = defs.map(def => ({
      points: pts.map(p => ({ x: p.F, y: p[def.key] })).filter(o => Number.isFinite(o.y)),
      color: def.key === 'dm' ? PALETTE[0] : def.key === 'di' ? PALETTE[1] : PALETTE[2],
      dash: def.dash, label: def.label
    })).filter(s => s.points.length);

    opt = { xMin: Fmin, xMax: Fmax, xLabel: 'F（熔体分数）', yLabel: 'δ (‰)', xTag: 'F', yDigits: 3 };

    const end = pts[0];
    stats = [
      [fmt(dbulk, 4), 'Δ_bulk (‰)'],
      [fmt(Db, 3), 'D_bulk'],
      [fmt(sx, 3), 'ΣX（未归一化）'],
      [fmt(end ? end.dm : null, 3), `${m.iso} 熔体（F_min）`]
    ];

    const rows = [];
    for (let k = 0; k < 9; k++){
      const p = pts[Math.round(k * (pts.length - 1) / 8)];
      if (!p) continue;
      rows.push(`<tr><td>${fmt(p.F, 4)}</td><td>${fmt(p.f, 4)}</td><td>${fmt(p.dm, 3)}</td><td>${fmt(p.di, 3)}</td><td>${fmt(p.dacc, 3)}</td><td>${fmt(p.C, 3)}</td></tr>`);
    }
    tableHTML = `<table><thead><tr><th>F</th><th>f</th><th>δ 熔体</th><th>δ 瞬时晶体</th><th>δ 累积晶体</th><th>C/C₀</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    tag.textContent = `多矿物 · ${minerals.length} 个矿物`;
    msg.className = 'note';
    msg.textContent = `Δ_bulk = ${fmt(dbulk, 4)}‰，D_bulk = ${fmt(Db, 3)}。若各矿物 D 相同，Δ_bulk 退化为模态加权 ΣXΔ/ΣX。`;
  }

  else if (m.mode === 'dT'){
    const pts = solveDT(m);
    series = [
      { points: pts.map(p => ({ x: p.F, y: p.melt })), color: PALETTE[0], dash: [], label: '熔体' },
      { points: pts.map(p => ({ x: p.F, y: p.inst })), color: PALETTE[1], dash: [6, 4], label: '瞬时晶体' }
    ];
    opt = { xMin: Math.min(...pts.map(p => p.F)), xMax: 1, xLabel: 'F（熔体分数）', yLabel: 'δ (‰)', xTag: 'F', yDigits: 3 };
    const start = pts[pts.length - 1];
    const end = pts[0];
    stats = [
      [fmt(start.dT, 3), 'Δ 起始 (‰)'],
      [fmt(end.dT, 3), 'Δ 终止 (‰)'],
      [fmt(end.melt, 3), `${m.iso} 熔体（F_min）`],
      [fmt(end.T, 0), '终止温度 (°C)']
    ];
    const rows = [];
    for (let k = 0; k < 9; k++){
      const p = pts[Math.round(k * (pts.length - 1) / 8)];
      if (!p) continue;
      rows.push(`<tr><td>${fmt(p.F, 4)}</td><td>${fmt(p.T, 0)}</td><td>${fmt(p.dT, 3)}</td><td>${fmt(p.melt, 3)}</td><td>${fmt(p.inst, 3)}</td><td>${fmt(p.C, 3)}</td></tr>`);
    }
    tableHTML = `<table><thead><tr><th>F</th><th>T (°C)</th><th>Δ (‰)</th><th>δ 熔体</th><th>δ 瞬时晶体</th><th>C/C₀</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    tag.textContent = `Δ(T) · ${m.formula === 'zr' ? 'Zr 锆石' : m.formula === 'ti' ? 'Ti 氧化物' : m.formula === 'fe' ? 'Fe 蒸气' : m.formula === 'v' ? 'V 矿物' : '自定义'}`;
    msg.className = 'note';
    msg.textContent = '积分步数随“点数”变化；恒温时与解析解一致（见“方程校验”）。';
  }

  else {
    const N = clamp(Math.round(m.N), 4, 400);
    const fmin = Math.max(1e-4, Math.min(m.fmin, 0.9999));
    const fmax = clamp(m.fmax, fmin + 1e-4, 1);
    const a = num(m.a, 1), b = num(m.b, 0), R0 = d2R(m.d0);
    const pts = [];
    for (let i = 0; i <= N; i++){
      const f = fmin + (fmax - fmin) * i / N;
      const ex = (a - 1) * Math.log(f) + b * (f - 1);
      pts.push({
        f,
        af: a + b * f,
        melt: R2d(R0 * Math.exp(ex)),
        inst: R2d(R0 * (a + b * f) * Math.exp(ex)),
        base: R2d(R0 * Math.pow(f, a - 1))
      });
    }
    series = [
      { points: pts.map(p => ({ x: p.f, y: p.melt })), color: PALETTE[0], dash: [], label: '变 α 熔体' },
      { points: pts.map(p => ({ x: p.f, y: p.inst })), color: PALETTE[1], dash: [6, 4], label: '变 α 瞬时晶体' },
      { points: pts.map(p => ({ x: p.f, y: p.base })), color: '#94a3b8', dash: [2, 3], label: '常数 α = a（平衡端元）' }
    ];
    opt = { xMin: fmin, xMax: fmax, xLabel: 'f（元素剩余分数）', yLabel: 'δ (‰)', xTag: 'f', yDigits: 3 };
    const end = pts[0], start = pts[pts.length - 1];
    stats = [
      [fmt(end.af, 6), 'α(f_min)'],
      [fmt(start.af, 6), 'α(f_max)'],
      [fmt(end.melt, 3), `${m.iso} 熔体（f_min）`],
      [fmt(end.melt - end.base, 3), '与常数 α 的差 (‰)']
    ];
    const rows = [];
    for (let k = 0; k < 9; k++){
      const p = pts[Math.round(k * (pts.length - 1) / 8)];
      if (!p) continue;
      rows.push(`<tr><td>${fmt(p.f, 4)}</td><td>${fmt(p.af, 6)}</td><td>${fmt(p.melt, 3)}</td><td>${fmt(p.inst, 3)}</td><td>${fmt(p.base, 3)}</td></tr>`);
    }
    tableHTML = `<table><thead><tr><th>f</th><th>α(f)</th><th>δ 变 α 熔体</th><th>δ 瞬时晶体</th><th>δ 常数 α</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
    tag.textContent = `变 α · a=${fmt(a, 6)}, b=${fmt(b, 6)}`;
    msg.className = 'note';
    msg.textContent = '灰色点线是同一个 a 作为常数 α 的瑞利曲线，用来显示 α 随 f 变化带来的偏离。';
  }

  if (charts.mineral) drawChart(charts.mineral, series, opt);
  renderLegend($('#mineralLegend'), series);
  $('#mineralSummary').innerHTML = stats.map(([v, k]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');
  $('#mineralTable').innerHTML = tableHTML;
}

/* ================= AFC isotope view ================= */
function afcRel(caC0, D, r, F){
  // removable singularity at D = 1 - r
  if (Math.abs(r + D - 1) < 1e-9) return 1 + caC0 * r * Math.log(F) / (r - 1);
  const z = (r + D - 1) / (r - 1);
  const x = Math.pow(F, -z);
  const A = r / (r - 1 + D);
  return x + A * caC0 * (1 - x);
}

function afcPoint(p, r, F){
  const isDelta = p.mode === 'delta';
  const a = isDelta ? alphaOf(p.delta, 'lin') : 1;
  const R0 = isDelta ? d2R(p.d0) : (+p.R0 || 0);
  const Ra = isDelta ? d2R(p.da) : (+p.Ra || 0);
  const ca = num(p.Ca, 0) / (num(p.C0, 1) || 1);
  const relH = afcRel(ca * Ra / R0, num(p.D, 0) * a, r, F);
  const relL = afcRel(ca, num(p.D, 0), r, F);
  const Rm = R0 * relH / relL;
  return { R: Rm, d: R2d(Rm), C: relL };
}

function afcSimpleR(p, r, F){
  const isDelta = p.mode === 'delta';
  const R0 = isDelta ? d2R(p.d0) : (+p.R0 || 0);
  const Ra = isDelta ? d2R(p.da) : (+p.Ra || 0);
  const rel = afcRel(num(p.Ca, 0) / (num(p.C0, 1) || 1), num(p.D, 0), r, F);
  const z = (r + num(p.D, 0) - 1) / (r - 1);
  const x = Math.pow(F, -z);
  return R0 + (Ra - R0) * (1 - x / rel);
}

function parseRList(str){
  const raw = String(str || '').split(/[,，;\s]+/).map(x => +x).filter(x => Number.isFinite(x) && x >= 0);
  return raw.filter(x => Math.abs(x - 1) > 1e-6).slice(0, 8);
}

function bindAFC(){
  const left = $('#left-afc');
  left.oninput = afcEdit;
  left.onchange = afcEdit;
}

function afcEdit(e){
  const t = e.target;
  const p = state.afc;
  if (t.id === 'amode'){ p.mode = t.value; renderAFC(); return; }
  const map = { ad0: 'd0', ada: 'da', aR0: 'R0', aRa: 'Ra', aC0: 'C0', aCa: 'Ca', aD: 'D', adelta: 'delta',
    arList: 'rList', aFmin: 'Fmin', aFmax: 'Fmax', aN: 'N' };
  if (map[t.id]){
    const k = map[t.id];
    if (k === 'rList') p[k] = t.value;
    else p[k] = num(t.value, p[k]);
    updateAFC();
    return;
  }
  if (t.id === 'aShowSimple'){ p.showSimple = t.checked; updateAFC(); }
}

function updateAFC(){
  const p = state.afc;
  const isDelta = p.mode === 'delta';
  const rs = parseRList(p.rList);
  const msg = $('#afcMsg');
  const tag = $('#afcTag');
  if (!msg || !tag) return;
  if (!rs.length){
    if (charts.afc) drawChart(charts.afc, [], { xMin: 0, xMax: 1, xLabel: 'F', yLabel: isDelta ? 'δ (‰)' : 'R' });
    $('#afcLegend').innerHTML = ''; $('#afcSummary').innerHTML = ''; $('#afcTable').innerHTML = '';
    msg.className = 'warnline bad';
    msg.textContent = 'r 列表为空或只含 r=1。请输入例如 0.3, 0.5。';
    return;
  }
  const N = clamp(Math.round(p.N), 4, 400);
  const Fmin = clamp(p.Fmin, 1e-3, 0.999);
  const Fmax = clamp(p.Fmax, Fmin + 1e-4, 1);
  const Fs = [];
  for (let i = 0; i <= N; i++) Fs.push(Fmin + (Fmax - Fmin) * i / N);

  const curves = rs.map((r, ri) => {
    const pts = Fs.map(F => {
      const q = afcPoint(p, r, F);
      return { x: F, y: isDelta ? q.d : q.R, C: q.C };
    });
    return { r, pts, color: PALETTE[ri % PALETTE.length] };
  });

  const series = curves.map(c => ({
    points: c.pts.map(q => ({ x: q.x, y: q.y })),
    color: c.color, dash: [], label: `r = ${fmt(c.r, 3)}`
  }));

  if (p.showSimple && isDelta && Math.abs(num(p.delta, 0)) > 1e-12){
    const c0 = curves[0];
    series.push({
      points: c0.pts.map(q => ({ x: q.x, y: R2d(afcSimpleR(p, c0.r, q.x)) })),
      color: '#94a3b8', dash: [2, 3], label: `r = ${fmt(c0.r, 3)} 简化（α=1）`
    });
  }

  const opt = { xMin: Fmin, xMax: Fmax, xLabel: 'F（残余熔体分数）', yLabel: isDelta ? 'δ (‰)' : 'R', xTag: 'F', yDigits: isDelta ? 3 : 5 };
  if (charts.afc) drawChart(charts.afc, series, opt);
  renderLegend($('#afcLegend'), series);

  const first = curves[0];
  const end = first.pts[0];
  $('#afcSummary').innerHTML = `
    <div class="stat"><b>${isDelta ? fmt(p.d0, 3) : fmt(p.R0, 5)}</b><span>${isDelta ? 'δ₀' : 'R₀'}</span></div>
    <div class="stat"><b>${isDelta ? fmt(end.y, 3) : fmt(end.y, 5)}</b><span>最演化值（F=${fmt(Fmin, 3)}）</span></div>
    <div class="stat"><b>${fmt(end.C, 3)}</b><span>C/C₀（F_min）</span></div>
    <div class="stat"><b>${rs.length}</b><span>条 r 曲线</span></div>`;

  const sample = [];
  for (let k = 0; k < 9; k++) sample.push(Math.round(k * (N) / 8));
  const rows = [];
  for (const i of sample){
    const F = Fs[i];
    if (F === undefined) continue;
    const cells = curves.map(c => `<td>${fmt(isDelta ? c.pts[i].y : c.pts[i].y, isDelta ? 3 : 5)}</td>`);
    rows.push(`<tr><td>${fmt(F, 4)}</td>${cells.join('')}<td>${fmt(curves[0].pts[i].C, 3)}</td></tr>`);
  }
  $('#afcTable').innerHTML = `<table><thead><tr><th>F</th>${curves.map(c => `<th>${isDelta ? 'δ' : 'R'} r=${fmt(c.r, 3)}</th>`).join('')}<th>C/C₀</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;

  tag.textContent = `${isDelta ? 'δ' : 'R'} · ${rs.length} 条 r`;
  const dropped = String(p.rList).split(/[,，;\s]+/).map(Number).filter(x => Math.abs(x - 1) <= 1e-6).length;
  msg.className = dropped ? 'warnline bad' : 'note';
  msg.textContent = dropped ? 'r = 1 会使解析解奇异，已跳过。' : '曲线颜色代表 r；表中最右列是 C/C₀（元素浓度，不是同位素）。';
}

function runTests(){
  const results = TESTS.map(t => {
    let got;
    try { got = t.got(); } catch (e) { got = NaN; }
    const diff = got - t.ref;
    const ok = Math.abs(diff) <= t.tol;
    return { ...t, got, diff, ok };
  });
  const pass = results.filter(r => r.ok).length;
  const html = `
    <div style="margin-bottom:10px"><b>${pass}/${results.length}</b> 项通过。参考值取自工作区表格的缓存值或解析恒等式；容差按量级给出。</div>
    <table>
      <thead><tr><th>校验项</th><th>计算值</th><th>参考值</th><th>差值</th><th>状态</th></tr></thead>
      <tbody>
        ${results.map(r => `<tr>
          <td>${esc(r.name)}<small style="display:block;color:#94a3b8;font-size:10.5px">${esc(r.detail)} · ${esc(r.src)}</small></td>
          <td>${fmt(r.got, 8)}</td>
          <td>${fmt(r.ref, 8)}</td>
          <td>${fmt(r.diff, 8)}</td>
          <td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? '通过' : '偏差'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  const dlg = $('#testBody');
  if (dlg) dlg.innerHTML = html;
  const box = $('#docTests');
  if (box) box.innerHTML = html;
  return { pass, total: results.length };
}

    <h2>4. 与表格算式的差别（使用时注意）</h2>
    <ol>
      <li><b>一阶近似 vs 精确式。</b>工作区多数表用 <code>1000·F^(Δ/1000) − 1000 + δ₀</code>；本程序用 <code>(δ₀+1000)·f^(α−1) − 1000</code>。两者相差 <code>δ₀·(f^(Δ/1000)−1)</code>，在 |δ₀| &lt; 10‰、|Δ| &lt; 1‰ 时通常小于 10⁻⁴‰，内置校验按 10⁻³‰ 容差比对。</li>
      <li><b>D 通常被当作 1。</b>Fe、Si、Zr 的表格多数直接以 F 作横轴；本程序保留 D，D = 1 时可复现原表。若 D ≠ 1，横轴 F 与元素剩余分数 f = F^D 不再相同，表和图会同时给出两者。</li>
      <li><b>Zr 表的 f。</b>“Zr isotope”表的 B 列由 A² 得到；“Table 5”则直接把 f 当横轴。本程序按定义 <code>f = F^D</code>（元素剩余分数）计算，与 Table 5 的曲线一致。</li>
      <li><b>O 平衡结晶的符号。</b>O isotope 表平衡结晶列的分母用 <code>F+(1−Δ)(1−F)</code>。本程序按 <code>F+(1−F)α</code>、α = 1+Δ/1000 计算；若你的 Δ 定义为“矿物−熔体”，平衡结晶应使熔体变轻，请核对原表的 Δ 符号。</li>
      <li><b>AFC 的简化式。</b>O isotope AFC 表用的是 White 型近似式 <code>δ = δ₀ + (δ_a−δ₀ + C_a/(C₀r))(1−F^(r/(1−r)))</code>。它与本程序的双同位素质量平衡在 F→1 时一致，但低 F 有系统偏差（例如 F=0.8 时约高 0.35‰），且 F→0 时趋于 δ_a+C_a/(C₀r) 而不是 δ_a。本程序用 DePaolo (1981) 线性解；α = 1 时与 A2 式完全等价（见校验）。</li>
      <li><b>S 去气未内置。</b>Bucholz (2020) 的 S 模型含 H₂S/SO₂ 物种分配与 fO₂ 依赖，不是单一 α 的瑞利式，需要专门程序。</li>
    </ol>

    <h2>5. 使用建议</h2>
    <ul>
      <li>先确定过程：晶体是否分离（分离 vs 平衡）、熔体是否抽离（批次 vs 分离熔融）、体系是否开放（去气）。</li>
      <li>Δ 的符号要统一：以“新相 − 熔体”为正。若文献给的是 1000lnα，则 Δ ≈ 1000lnα；程序可切换 α 的换算方式。</li>
      <li>D 要按元素与矿物组合分别给出；多矿物时用 Δ(T) 模式或 V 型 D 加权，避免把 Δ 简单按模态平均。</li>
      <li>F → 0 时瑞利曲线会发散，这是模型性质而非数值错误；绘图范围建议 F ≥ 0.01–0.02。</li>
      <li>去气模型的 F_v 是“已逃逸蒸气占初始体系的质量分数”，不是熔体分数；横轴标签会随过程切换。</li>
      <li>把程序结果与工作区原表对照时，先设 D = 1、Δ 与 δ₀ 相同，再比较。</li>
    </ul>

    <p>参考值来自工作区表格的缓存值（例如 <code>Si isotope!D16</code>、<code>Fe Isotope melt-vapor!B43</code>）与解析恒等式。</p>

    <h2>7. 参考</h2>

      <li>Savage, P.S. et al. (2011) Silicon isotope fractionation during magmatic differentiation. <i>GCA</i> 75, 6124–6139.</li>

      <li>Teng, F.-Z. et al. (2006)；Fan et al. (2020) 锂同位素流体出溶（工作区 Li isotope 表）。</li>
      <li>Marschall, H.R. et al. (2009) Boron isotope fractionation between tourmaline and fluid. <i>CMP</i> 158, 675–681.</li>
      <li>Johnson, A.C. et al. (2019) Titanium isotopic fractionation in Kilauea Iki lava lake. <i>GCA</i> 264, 180–190.</li>
      <li>Prytulak, J. et al. (2016) Stable vanadium isotopes as a redox proxy. <i>Geochem. Persp. Lett.</i></li>
      <li>White, W.M. (2015) <i>Isotope Geochemistry</i>（O isotope AFC 表）。</li>
      <li>Mejía, L.M. et al. (2019) General Rayleigh distillation accounting for crystal growth. <i>SA</i>（工作区表格）。</li>
      <li>Bucholz, C.E. et al. (2020) Sulfur devolatilization modeling. <i>EPSL</i>（工作区表格）。</li>
    </ul>
    <p class="kv">本工具用于正演估算与教学；分配系数、Δ 与 D 的选取需结合具体体系判断。</p>`;

  const btn = $('#btnRunTests');
  if (btn) btn.onclick = () => { runTests(); };
  runTests();
}

/* ================= CSV ================= */
function download(filename, text){
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function csvCell(v){
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(){
  const lines = [];
  if (state.view === 'main'){
    const s = state.main;
    lines.push(['process', 'system', 'isotope', 'F', 'f', 'delta_melt', 'delta_inst', 'delta_acc', 'C_over_C0']);
    const vis = s.systems.filter(x => x.on);
    const Fs = mainGrid(s);
    for (const sys of vis){
      for (const F of Fs){
        const p = computePoint(s.proc, sys, F, s.alphaMode);
        if (!p) continue;
        lines.push([s.proc, sys.name, sys.iso, p.F, p.f, p.dm, p.di, p.dacc, p.C]);
      }
    }
    download('同位素瑞利分馏_主视图.csv', '\ufeff' + lines.map(r => r.map(csvCell).join(',')).join('\r\n'));
    return;
  }

  if (state.view === 'mineral'){
    const m = state.mineral;
    if (m.mode === 'multi'){
      const minerals = m.minerals.map(x => ({ X: Math.max(0, num(x.X, 0)), delta: num(x.delta, 0), D: Math.max(0, num(x.D, 0)) }));
      let sx = 0, sxd = 0, sxdD = 0;
      for (const mi of minerals){ sx += mi.X; sxd += mi.X * mi.D; sxdD += mi.X * mi.D * mi.delta; }
      const Db = sx > 0 ? sxd / sx : 0;
      const dbulk = sxd > 1e-12 ? sxdD / sxd : 0;
      const sys = { d0: m.d0, delta: dbulk, D: Db };
      lines.push(['mode', 'system', 'isotope', 'F', 'f', 'delta_melt', 'delta_inst', 'delta_acc', 'C_over_C0']);
      const N = clamp(Math.round(m.N), 4, 400);
      const Fmin = Math.max(1e-4, Math.min(m.Fmin, 0.999));
      const Fmax = clamp(m.Fmax, Fmin + 1e-4, 1);
      for (let i = 0; i <= N; i++){
        const F = Fmin + (Fmax - Fmin) * i / N;
        const p = computePoint('fc', sys, F, 'lin');
        if (p) lines.push(['multi', m.name, m.iso, p.F, p.f, p.dm, p.di, p.dacc, p.C]);
      }
    } else if (m.mode === 'dT'){
      lines.push(['mode', 'system', 'isotope', 'F', 'T_C', 'delta_phase', 'delta_melt', 'delta_inst', 'C_over_C0']);
      for (const p of solveDT(m)){
        lines.push(['dT', m.name, m.iso, p.F, p.T, p.dT, p.melt, p.inst, p.C]);
      }
    } else {
      lines.push(['mode', 'system', 'isotope', 'f', 'alpha_f', 'delta_melt', 'delta_inst', 'delta_const_alpha']);
      const N = clamp(Math.round(m.N), 4, 400);
      const fmin = Math.max(1e-4, Math.min(m.fmin, 0.9999));
      const fmax = clamp(m.fmax, fmin + 1e-4, 1);
      const a = num(m.a, 1), b = num(m.b, 0), R0 = d2R(m.d0);
      for (let i = 0; i <= N; i++){
        const f = fmin + (fmax - fmin) * i / N;
        const ex = (a - 1) * Math.log(f) + b * (f - 1);
        lines.push(['alphaF', m.name, m.iso, f, a + b * f, R2d(R0 * Math.exp(ex)), R2d(R0 * (a + b * f) * Math.exp(ex)), R2d(R0 * Math.pow(f, a - 1))]);
      }
    }
    download('同位素瑞利分馏_多矿物与变α.csv', '\ufeff' + lines.map(r => r.map(csvCell).join(',')).join('\r\n'));
    return;
  }

  if (state.view === 'afc'){
    const p = state.afc;
    const rs = parseRList(p.rList);
    const isDelta = p.mode === 'delta';
    lines.push(['mode', 'r', 'F', isDelta ? 'delta_melt' : 'R_melt', 'C_over_C0']);
    const N = clamp(Math.round(p.N), 4, 400);
    const Fmin = clamp(p.Fmin, 1e-3, 0.999);
    const Fmax = clamp(p.Fmax, Fmin + 1e-4, 1);
    for (const r of rs){
      for (let i = 0; i <= N; i++){
        const F = Fmin + (Fmax - Fmin) * i / N;
        const q = afcPoint(p, r, F);
        lines.push([p.mode, r, F, isDelta ? q.d : q.R, q.C]);
      }
    }
    download('同位素瑞利分馏_AFC.csv', '\ufeff' + lines.map(r => r.map(csvCell).join(',')).join('\r\n'));
  }
}

/* ================= shell ================= */
function populatePresets(){
  const sel = $('#preset');
  const list = PRESETS[state.view] || [];
  sel.disabled = !list.length;
  sel.innerHTML = list.length
    ? list.map(p => `<option value="${p.key}" ${p.key === state.presetKey[state.view] ? 'selected' : ''}>${esc(p.label)}</option>`).join('')
    : '<option>—</option>';
}

function applyPreset(key){
  const list = PRESETS[state.view] || [];
  const p = list.find(x => x.key === key);
  if (!p) return;
  state[state.view] = deepClone(p.state);
  state.presetKey[state.view] = key;
  renderView();
}

function renderView(){
  $$('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + state.view));
  $$('#viewNav .mod-btn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.body.dataset.view = state.view;
  $('#subtitle').textContent = SUBTITLES[state.view];
  $('#btnCSV').disabled = state.view === 'docs';
  populatePresets();
  if (state.view === 'main') renderMain();
  else if (state.view === 'mineral') renderMineral();
  else if (state.view === 'afc') renderAFC();
  else renderDocs();
}

function init(){
  $$('#viewNav .mod-btn').forEach(b => {
    b.onclick = () => {
      if (state.view === b.dataset.view) return;
      state.view = b.dataset.view;
      renderView();
    };
  });
  $('#preset').onchange = e => applyPreset(e.target.value);
  $('#btnTest').onclick = () => {
    runTests();
    $('#testDialog').showModal();
  };
  $('#dlgClose').onclick = () => $('#testDialog').close();
  $('#btnCSV').onclick = exportCSV;

  let raf = null;
  window.addEventListener('resize', () => {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (state.view === 'main') updateMain();
      else if (state.view === 'mineral') updateMineral();
      else if (state.view === 'afc') updateAFC();
    });
  });

  renderView();
}

init();
</script>
